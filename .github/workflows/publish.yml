# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── AUTHENTICATION ────────────────────────────────────────────────────────────
#
# This workflow authenticates with npm Trusted Publishing (OIDC): GitHub mints a
# short-lived token for this job and npm exchanges it for publish rights. There
# is no NPM_TOKEN secret. npm is phasing out token-based publishing, so do not
# add one back.
#
# Requirements:
#   - npm CLI ≥ 11.5.1 (ships with the Node version pinned in .nvmrc).
#   - `id-token: write` on the job (see below).
#   - `repository.url` in package.json must match this GitHub repository.
#
# ─── ONE-TIME SETUP (npmjs.com) ────────────────────────────────────────────────
#
# Must be done by an account with write access to @canva/n8n-nodes-canva
# (currently owned by the `canva-dev` npm account).
#
#   1. Open https://www.npmjs.com/package/@canva/n8n-nodes-canva/access
#   2. Under "Trusted Publisher", choose GitHub Actions and fill in:
#        Organization or user: canva-sdks
#        Repository:           n8n-nodes-canva
#        Workflow filename:    publish.yml
#        Environment name:     (leave blank)
#   3. Under "Publishing access", select
#      "Require two-factor authentication and disallow tokens".
#
# Or from a terminal logged in to that account:
#
#   npm trust github @canva/n8n-nodes-canva --repo canva-sdks/n8n-nodes-canva \
#     --file publish.yml --allow-publish
#
# A new trusted publisher expires if it has not published within 2 days, so
# push a release tag (or re-run a failed publish) soon after setting it up.
#
# If this file is renamed, update the workflow filename on npmjs.com too.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally from an up-to-date `main`:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push — which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required for npm Trusted Publishing and the provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        # Lints, builds, then runs `npm publish` with provenance. npm detects
        # the GitHub Actions OIDC environment and uses Trusted Publishing.
        run: 'npm run release'
